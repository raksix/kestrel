[workspace]
resolver = "2"
members = ["src-tauri", "crates/kestrel-core", "crates/kestrel-capture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/raksix/kestrel"
authors = ["Kestrel contributors"]

[workspace.dependencies]
kestrel-core = { path = "crates/kestrel-core" }
kestrel-capture = { path = "crates/kestrel-capture" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = "0.4"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
xcap = "0.9"
