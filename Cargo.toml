[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/kestrel-core",
    "crates/kestrel-capture",
    "crates/kestrel-editor",
    "crates/kestrel-upload",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/raksix/kestrel"
authors = ["Kestrel contributors"]

[workspace.dependencies]
kestrel-core = { path = "crates/kestrel-core" }
kestrel-capture = { path = "crates/kestrel-capture" }
kestrel-editor = { path = "crates/kestrel-editor" }
kestrel-upload = { path = "crates/kestrel-upload" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = "0.4"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
xcap = "0.9"

# A debug build of this app spends nearly all its time inside `image`, and at
# opt-level 0 a single Retina screenshot takes seconds. Optimising dependencies
# fully (they are rebuilt rarely) and our own crates lightly keeps `tauri dev`
# responsive without hurting incremental rebuild times.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
