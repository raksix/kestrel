name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS builds rather than a universal binary: a universal build
          # doubles the download for everyone to spare one architecture a
          # separate file, and both machines are cheap to build for.
          - os: macos-latest
            label: macOS (Apple silicon)
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            label: Linux
            args: ""
            target: ""
          - os: windows-latest
            label: Windows
            args: ""
            target: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libgbm-dev \
            patchelf \
            fonts-dejavu-core \
            libpipewire-0.3-dev

      - run: npm ci

      # The `kestrel` command is a separate binary from the app, so the bundler
      # does not build it. Without this the release would ship an app with no
      # command line, which the README says exists.
      - name: Build the command-line binary
        run: cargo build --release -p kestrel-cli ${{ matrix.args }}

      # Export the signing credentials only when they are actually set.
      #
      # An empty environment variable is still a *set* environment variable, and
      # Tauri checks presence rather than content — so passing an unset secret
      # straight through made it try to import an empty certificate into the
      # keychain and fail the whole build. Nothing is exported here unless it
      # has a value, which leaves Tauri on the ad-hoc identity from
      # tauri.conf.json.
      - name: Export signing credentials if they exist
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          exported=0
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE \
                      APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD \
                      APPLE_TEAM_ID WINDOWS_CERTIFICATE \
                      WINDOWS_CERTIFICATE_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
              exported=$((exported + 1))
            fi
          done

          if [ "$exported" -eq 0 ]; then
            echo "No signing secrets set; building ad-hoc signed."
          else
            echo "Exported $exported signing credential(s)."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Kestrel ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Unsigned builds. macOS will refuse to open the app on first launch:
            right-click it and choose Open, or run
            `xattr -dr com.apple.quarantine /Applications/Kestrel.app`.

            The `kestrel` command-line binary is attached separately.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri names the disk images by architecture, which is correct and
      # unhelpful: aarch64 and x64 do not tell someone which Mac they have.
      - name: Rename the disk images to say which Mac they are for
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) from="${version}_aarch64"; to="macOS-Apple-Silicon" ;;
            *)                    from="${version}_x64";     to="macOS-Intel" ;;
          esac

          source="target/${{ matrix.target }}/release/bundle/dmg/Kestrel_${from}.dmg"
          if [ ! -f "$source" ]; then
            echo "::error::no disk image at $source"
            exit 1
          fi

          renamed="Kestrel-${version}-${to}.dmg"
          cp "$source" "$renamed"
          gh release upload "$tag" "$renamed" --clobber
          # Remove the architecture-named copy so there is one obvious file per
          # machine rather than two identical ones with different names.
          gh release delete-asset "$tag" "Kestrel_${from}.dmg" --yes || true

      - name: Attach the command-line binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          dir="target/${{ matrix.target }}/release"
          [ -n "${{ matrix.target }}" ] || dir="target/release"

          binary="$dir/kestrel"
          [ -f "$binary" ] || binary="$dir/kestrel.exe"

          if [ ! -f "$binary" ]; then
            echo "::error::the kestrel binary was not built at $dir"
            exit 1
          fi

          name="kestrel-$(echo '${{ matrix.label }}' | tr ' ()' '-' | tr -s '-' | sed 's/-$//')"
          [ "${{ matrix.os }}" != "windows-latest" ] || name="$name.exe"
          cp "$binary" "$name"
          gh release upload "$tag" "$name" --clobber
