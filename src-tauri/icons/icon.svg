<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kestrel">
  <title>Kestrel</title>

  <!--
    A raptor's eye that is also a lens aperture.

    Kestrels are known for their eyesight — they hover and watch, which is a
    fair description of what a capture tool does while it waits for you to pick
    something. An aperture alone would read as a generic camera app; the brow
    over the top is what makes it a bird of prey, and it is the one asymmetric
    shape in the mark.

    The geometry is computed, not drawn. The opening is a hexagon at radius 68;
    each blade seam runs from one of its vertices to the outer circle sixty
    degrees on, which is the slant a real blade edge has — a radial line would
    read as a pie chart. An earlier version cut the blades as chords through
    the middle and came out as a starburst, which is what happens when the
    construction is guessed instead of worked out.
  -->

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#232A40" />
      <stop offset="1" stop-color="#0D1119" />
    </linearGradient>

    <!-- Rufous through amber: a kestrel's own colours, and warm enough to hold
         up against a dark tile at 16 pixels. -->
    <linearGradient id="iris" x1="0.18" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#FFCE7A" />
      <stop offset="0.45" stop-color="#F09A42" />
      <stop offset="1" stop-color="#C2551F" />
    </linearGradient>

    <radialGradient id="pupil" cx="0.36" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#28304A" />
      <stop offset="1" stop-color="#06080E" />
    </radialGradient>

    <!-- The brow is its own dark amber rather than the tile colour, so it
         reads as a ridge overhanging the eye. Cutting it out of the iris was
         tried first and looked like the circle had been clipped by mistake. -->
    <linearGradient id="ridge" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7A3A14" />
      <stop offset="1" stop-color="#4A2210" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)" />

  <g>
    <circle cx="256" cy="256" r="152" fill="url(#iris)" />

    <!-- Blade seams. Cut in the tile colour so they are the same gaps the brow
         is, rather than a third tone competing with the two that matter. -->
    <g stroke="#0D1119" stroke-width="11" stroke-linecap="round" opacity="0.92" fill="none">
      <path d="M256.0 188.0 L387.6 180.0" />
      <path d="M314.9 222.0 L387.6 332.0" />
      <path d="M314.9 290.0 L256.0 408.0" />
      <path d="M256.0 324.0 L124.4 332.0" />
      <path d="M197.1 290.0 L124.4 180.0" />
      <path d="M197.1 222.0 L256.0 104.0" />
    </g>

    <!-- The opening, from the same six vertices the seams start at. -->
    <path
      d="M256.0 188.0 L314.9 222.0 L314.9 290.0 L256.0 324.0 L197.1 290.0 L197.1 222.0 Z"
      fill="url(#pupil)"
    />

    <!-- One catchlight. It is the difference between an eye and a diagram. -->
    <circle cx="236" cy="236" r="13" fill="#FFFFFF" opacity="0.85" />

  </g>
</svg>
