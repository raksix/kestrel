[package]
# Named kestrel-app, not kestrel: the CLI crate already produces a binary
# called `kestrel`, and on macOS and Windows the filesystem is case-insensitive,
# so `target/debug/Kestrel` and `target/debug/kestrel` are the same file. With
# both called kestrel, whichever built last silently replaced the other.
name = "kestrel-app"
description = "Cross-platform capture, annotation and sharing tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "kestrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kestrel-core.workspace = true
kestrel-capture.workspace = true
kestrel-editor.workspace = true
kestrel-record.workspace = true
kestrel-tools.workspace = true
kestrel-upload.workspace = true

tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3"
dirs = "6"
# Bundled SQLite so history does not depend on what the host has installed.
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
# Only for fetching the OCR models. Same TLS stack as kestrel-upload, so this
# adds no new build dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
getrandom = "0.4.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[lints.rust]
unsafe_code = "deny"
